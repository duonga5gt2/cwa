version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: pg_local
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: next_app
    environment:
      # Inside container talk to Postgres via service name "db"
      DATABASE_URL: postgres://appuser:apppass@db:5432/appdb
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
